name: Android - build debug APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub ubuntu-latest already includes Android SDK; avoid downloading obsolete SDK 'tools'.
      - name: Verify preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "Android SDK from runner: $ANDROID_HOME"
      - name: Install dependencies and build frontend
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build
      - name: Generate isolated Android project and copy web bundle
        run: |
          pnpm exec cap add android
          pnpm exec cap sync android
      - name: Compile debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: campolab-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
