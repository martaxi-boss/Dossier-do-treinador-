name: Quality - TypeScript, tests and web build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated project dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Static TypeScript validation
        run: pnpm run check
      - name: Unit tests
        run: pnpm test
      - name: Production web build
        run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: campolab-web-build
          path: dist/
          if-no-files-found: error
