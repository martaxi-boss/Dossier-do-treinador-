name: Quality - TypeScript, tests and web build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated project dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Static TypeScript validation
        run: pnpm run check
      - name: Unit tests
        run: pnpm test
      - name: Production web build
        run: pnpm run build
      - name: Install Chromium for browser interaction tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser interaction smoke tests (desktop and mobile)
        run: pnpm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: campolab-browser-failure-evidence
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: campolab-web-build
          path: dist/
          if-no-files-found: error
